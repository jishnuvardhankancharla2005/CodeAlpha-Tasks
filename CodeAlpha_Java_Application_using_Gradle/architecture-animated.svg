<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background: #0d1117; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; border-radius: 12px; border: 1px solid #30363d;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="promGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f78166" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#da3633" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="grafanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9e6a03" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="jenkinsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .node-box { rx: 10px; ry: 10px; stroke-width: 1.5px; transition: all 0.3s; }
    .title-text { font-size: 15px; font-weight: 700; fill: #f0f6fc; }
    .subtitle-text { font-size: 11px; fill: #8b949e; }
    .badge-text { font-size: 10px; font-weight: 600; fill: #ffffff; }
    
    /* Animations */
    @keyframes flowDash {
      to { stroke-dashoffset: -32; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
    @keyframes moveDot {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }
    @keyframes beaconPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 14px; opacity: 0; }
    }

    .flow-line {
      stroke-dasharray: 8 6;
      animation: flowDash 1.2s linear infinite;
    }
    
    .pulse-ring {
      animation: beaconPulse 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .status-dot {
      animation: pulseGlow 2s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>

  <!-- Header Section -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="800" fill="#58a6ff" letter-spacing="1">
    ⚡ CODEALPHA TASK 3: SYSTEM ARCHITECTURE &amp; OBSERVABILITY PIPELINE
  </text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#8b949e">
    Interactive Real-Time Dataflow &amp; Distributed Microservice Telemetry
  </text>

  <!-- CONNECTIONS & PATHS -->

  <!-- Flow 1: Client -> Spring Boot -->
  <path id="pathClientToApp" d="M 140 210 L 230 210" stroke="#3fb950" stroke-width="2.5" class="flow-line"/>
  
  <!-- Flow 2: Spring Boot -> Prometheus (Actuator Scrape) -->
  <path id="pathAppToProm" d="M 430 190 L 520 190" stroke="#f78166" stroke-width="2.5" class="flow-line"/>
  
  <!-- Flow 3: Node Exporter -> Prometheus -->
  <path id="pathNodeToProm" d="M 430 360 L 475 360 L 475 230 L 520 230" stroke="#bc8cff" stroke-width="2.5" class="flow-line" fill="none"/>
  
  <!-- Flow 4: Prometheus -> Grafana -->
  <path id="pathPromToGrafana" d="M 720 210 L 720 310 L 720 320" stroke="#d29922" stroke-width="2.5" class="flow-line" fill="none"/>
  
  <!-- Flow 5: Jenkins Pipeline -> Spring Boot Deployment -->
  <path id="pathJenkinsToApp" d="M 330 400 L 330 270" stroke="#58a6ff" stroke-width="2.5" class="flow-line"/>

  <!-- ANIMATED PULSE PARTICLES ALONG PATHS -->
  <circle r="4" fill="#3fb950">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 140 210 L 230 210"/>
  </circle>
  
  <circle r="4" fill="#f78166">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 430 190 L 520 190"/>
  </circle>

  <circle r="4" fill="#bc8cff">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 430 360 L 475 360 L 475 230 L 520 230"/>
  </circle>

  <circle r="4" fill="#d29922">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 720 210 L 720 320"/>
  </circle>

  <circle r="4" fill="#58a6ff">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 330 400 L 330 270"/>
  </circle>


  <!-- NODES / COMPONENTS -->

  <!-- NODE 1: Client / Browser -->
  <g transform="translate(30, 150)">
    <rect class="node-box" width="110" height="120" fill="#161b22" stroke="#30363d"/>
    <circle cx="55" cy="40" r="18" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <!-- User Icon -->
    <path d="M 55 32 A 6 6 0 1 0 55 44 A 6 6 0 1 0 55 32 M 43 52 C 43 47 48 46 55 46 C 62 46 67 47 67 52" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="55" y="75" text-anchor="middle" class="title-text" font-size="13">User / Browser</text>
    <text x="55" y="93" text-anchor="middle" class="subtitle-text">REST Client</text>
    <rect x="15" y="102" width="80" height="14" rx="4" fill="#238636"/>
    <text x="55" y="113" text-anchor="middle" class="badge-text">PORT 5173</text>
  </g>

  <!-- NODE 2: Spring Boot Microservice (Central App) -->
  <g transform="translate(230, 130)">
    <rect class="node-box" width="200" height="140" fill="url(#springGrad)" stroke="#2ea043" filter="url(#glowGreen)"/>
    <rect class="node-box" width="200" height="140" fill="none" stroke="#2ea043"/>
    <!-- Status Beacon -->
    <circle cx="180" cy="20" r="4" fill="#3fb950"/>
    <circle cx="180" cy="20" r="4" fill="none" stroke="#3fb950" class="pulse-ring"/>
    
    <text x="20" y="32" class="title-text" fill="#3fb950">⚡ Spring Boot App</text>
    <text x="20" y="48" class="subtitle-text">Java 21 LTS | Gradle 8.13</text>

    <!-- Sub-components inside App -->
    <rect x="15" y="60" width="80" height="35" rx="5" fill="#21262d" stroke="#30363d"/>
    <text x="55" y="77" text-anchor="middle" font-size="10" fill="#f0f6fc" font-weight="600">Task REST API</text>
    <text x="55" y="89" text-anchor="middle" font-size="8" fill="#8b949e">CRUD Endpoints</text>

    <rect x="105" y="60" width="80" height="35" rx="5" fill="#21262d" stroke="#30363d"/>
    <text x="145" y="77" text-anchor="middle" font-size="10" fill="#3fb950" font-weight="600">Actuator</text>
    <text x="145" y="89" text-anchor="middle" font-size="8" fill="#8b949e">/prometheus</text>

    <!-- App Footer / Port -->
    <rect x="15" y="108" width="170" height="20" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="122" text-anchor="middle" font-size="10" fill="#3fb950" font-weight="700">Docker Container :8085</text>
  </g>

  <!-- NODE 3: Prometheus Engine -->
  <g transform="translate(520, 130)">
    <rect class="node-box" width="200" height="140" fill="url(#promGrad)" stroke="#f78166" filter="url(#glowOrange)"/>
    <rect class="node-box" width="200" height="140" fill="none" stroke="#f78166"/>
    <!-- Status Beacon -->
    <circle cx="180" cy="20" r="4" fill="#f78166"/>
    <circle cx="180" cy="20" r="4" fill="none" stroke="#f78166" class="pulse-ring"/>

    <text x="20" y="32" class="title-text" fill="#f78166">🔥 Prometheus TSDB</text>
    <text x="20" y="48" class="subtitle-text">Time-Series Metrics Scraper</text>

    <rect x="15" y="60" width="170" height="35" rx="5" fill="#21262d" stroke="#30363d"/>
    <text x="100" y="76" text-anchor="middle" font-size="10" fill="#f0f6fc" font-weight="600">Scrape Target Loop (15s)</text>
    <text x="100" y="89" text-anchor="middle" font-size="8" fill="#f78166">jvm_memory_bytes | http_requests</text>

    <rect x="15" y="108" width="170" height="20" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="122" text-anchor="middle" font-size="10" fill="#f78166" font-weight="700">Metrics Engine :9090</text>
  </g>

  <!-- NODE 4: Node Exporter (System Telemetry) -->
  <g transform="translate(230, 310)">
    <rect class="node-box" width="200" height="100" fill="url(#nodeGrad)" stroke="#bc8cff"/>
    <circle cx="180" cy="20" r="4" fill="#bc8cff"/>

    <text x="20" y="30" class="title-text" fill="#bc8cff">💻 Node Exporter</text>
    <text x="20" y="45" class="subtitle-text">Host OS Performance Agent</text>

    <rect x="15" y="55" width="170" height="32" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="70" text-anchor="middle" font-size="10" fill="#e3b341">CPU / RAM / Disk I/O Metrics</text>
    <text x="100" y="82" text-anchor="middle" font-size="8" fill="#bc8cff">Agent Port :9100</text>
  </g>

  <!-- NODE 5: Grafana Observability Dashboard -->
  <g transform="translate(620, 320)">
    <rect class="node-box" width="200" height="130" fill="url(#grafanaGrad)" stroke="#d29922"/>
    <circle cx="180" cy="20" r="4" fill="#d29922"/>
    <circle cx="180" cy="20" r="4" fill="none" stroke="#d29922" class="pulse-ring"/>

    <text x="20" y="32" class="title-text" fill="#d29922">📊 Grafana Dashboards</text>
    <text x="20" y="48" class="subtitle-text">Real-Time Visualization</text>

    <!-- Mini Dashboard Chart Simulation -->
    <rect x="15" y="58" width="170" height="35" rx="4" fill="#161b22" stroke="#30363d"/>
    <path d="M 25 82 Q 55 65, 85 75 T 145 62 T 175 78" fill="none" stroke="#d29922" stroke-width="2"/>
    <path d="M 25 82 Q 55 65, 85 75 T 145 62 T 175 78 L 175 88 L 25 88 Z" fill="#d29922" opacity="0.15"/>

    <rect x="15" y="100" width="170" height="20" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="114" text-anchor="middle" font-size="10" fill="#d29922" font-weight="700">UI Studio :3000 (admin/admin)</text>
  </g>

  <!-- NODE 6: Jenkins CI/CD Automation Pipeline -->
  <g transform="translate(30, 390)">
    <rect class="node-box" width="170" height="100" fill="url(#jenkinsGrad)" stroke="#58a6ff" filter="url(#glowBlue)"/>
    <circle cx="150" cy="18" r="4" fill="#58a6ff"/>

    <text x="15" y="26" class="title-text" font-size="13" fill="#58a6ff">⚙️ Jenkins CI/CD</text>
    <text x="15" y="40" class="subtitle-text">8-Stage Automated Pipeline</text>

    <rect x="10" y="50" width="150" height="22" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="85" y="65" text-anchor="middle" font-size="9" fill="#3fb950" font-weight="600">✓ Build • Test • Deploy</text>

    <rect x="10" y="76" width="150" height="16" rx="3" fill="#1f6feb"/>
    <text x="85" y="88" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="700">Jenkinsfile :8085</text>
  </g>

  <!-- Legend / Stats Bar at bottom -->
  <g transform="translate(230, 465)">
    <rect width="590" height="35" rx="6" fill="#161b22" stroke="#30363d"/>
    
    <circle cx="20" cy="17" r="4" fill="#3fb950"/>
    <text x="30" y="21" font-size="10" fill="#8b949e">Microservice: <tspan fill="#f0f6fc" font-weight="700">Healthy</tspan></text>

    <circle cx="150" cy="17" r="4" fill="#f78166"/>
    <text x="160" y="21" font-size="10" fill="#8b949e">Prometheus: <tspan fill="#f0f6fc" font-weight="700">15s Scrape</tspan></text>

    <circle cx="280" cy="17" r="4" fill="#d29922"/>
    <text x="290" y="21" font-size="10" fill="#8b949e">Grafana: <tspan fill="#f0f6fc" font-weight="700">Provisioned</tspan></text>

    <circle cx="410" cy="17" r="4" fill="#58a6ff"/>
    <text x="420" y="21" font-size="10" fill="#8b949e">Pipeline: <tspan fill="#f0f6fc" font-weight="700">Declarative</tspan></text>
  </g>

</svg>
