<svg width="960" height="340" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D24939"/>
      <stop offset="100%" stop-color="#8f2f24"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f89820"/>
      <stop offset="100%" stop-color="#b56e10"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2496ED"/>
      <stop offset="100%" stop-color="#0f5fa8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .pulse2 { animation: pulse 2.4s ease-in-out infinite 0.4s; }
      .pulse3 { animation: pulse 2.4s ease-in-out infinite 0.8s; }
      @keyframes pulse {
        0%   { opacity: 0.75; }
        50%  { opacity: 1; }
        100% { opacity: 0.75; }
      }
      .flowline {
        stroke-dasharray: 8 6;
        animation: dash 1.2s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -28; }
      }
      .label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e2e8f0; }
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; font-weight: 700; }
      .sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #cbd5e1; font-size: 12px; }
      .tag { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; font-size: 11px; }
    </style>
  </defs>

  <rect width="960" height="340" rx="16" fill="url(#bgGrad)"/>

  <text x="480" y="34" text-anchor="middle" class="title" font-size="18">
    CI/CD → Build Automation → Container Deployment Pipeline
  </text>
  <text x="480" y="54" text-anchor="middle" class="tag">
    end-to-end DevOps workflow across three integrated internship deliverables
  </text>

  <!-- Node 1: Jenkins Remoting -->
  <g class="pulse" filter="url(#glow)">
    <rect x="40" y="110" width="240" height="130" rx="14" fill="url(#boxGrad1)" stroke="#ffffff" stroke-opacity="0.25"/>
  </g>
  <text x="160" y="150" text-anchor="middle" class="title" font-size="15">⚙️ Task 2</text>
  <text x="160" y="172" text-anchor="middle" class="label" font-size="14">Jenkins Remoting</text>
  <text x="160" y="192" text-anchor="middle" class="sub">Distributed multi-node pipeline</text>
  <text x="160" y="208" text-anchor="middle" class="sub">Windows + Linux agents</text>
  <text x="160" y="224" text-anchor="middle" class="sub">Node isolation &amp; security gates</text>

  <!-- Node 2: Gradle Build -->
  <g class="pulse2" filter="url(#glow)">
    <rect x="360" y="110" width="240" height="130" rx="14" fill="url(#boxGrad2)" stroke="#ffffff" stroke-opacity="0.25"/>
  </g>
  <text x="480" y="150" text-anchor="middle" class="title" font-size="15">☕ Task 3</text>
  <text x="480" y="172" text-anchor="middle" class="label" font-size="14">Java + Gradle Build</text>
  <text x="480" y="192" text-anchor="middle" class="sub">Spring Boot microservice</text>
  <text x="480" y="208" text-anchor="middle" class="sub">Automated tests + metrics</text>
  <text x="480" y="224" text-anchor="middle" class="sub">Prometheus / Grafana observability</text>

  <!-- Node 3: Docker Web Server -->
  <g class="pulse3" filter="url(#glow)">
    <rect x="680" y="110" width="240" height="130" rx="14" fill="url(#boxGrad3)" stroke="#ffffff" stroke-opacity="0.25"/>
  </g>
  <text x="800" y="150" text-anchor="middle" class="title" font-size="15">🐳 Task 4</text>
  <text x="800" y="172" text-anchor="middle" class="label" font-size="14">Docker Web Server</text>
  <text x="800" y="192" text-anchor="middle" class="sub">Load-balanced Nginx cluster</text>
  <text x="800" y="208" text-anchor="middle" class="sub">Auto-healing + failover</text>
  <text x="800" y="224" text-anchor="middle" class="sub">Isolated frontend/backend networks</text>

  <!-- Connector 1 -->
  <path d="M280 175 H360" stroke="#f8fafc" stroke-width="2.5" class="flowline" fill="none"/>
  <polygon points="356,169 368,175 356,181" fill="#f8fafc"/>
  <circle r="4" fill="#ffffff">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M280 175 H360"/>
  </circle>

  <!-- Connector 2 -->
  <path d="M600 175 H680" stroke="#f8fafc" stroke-width="2.5" class="flowline" fill="none"/>
  <polygon points="676,169 688,175 676,181" fill="#f8fafc"/>
  <circle r="4" fill="#ffffff">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M600 175 H680"/>
  </circle>

  <!-- Footer strip -->
  <text x="480" y="270" text-anchor="middle" class="sub">
    build triggered remotely  →  compiled &amp; tested via Gradle  →  packaged, containerized &amp; deployed
  </text>
  <text x="480" y="300" text-anchor="middle" class="tag">
    CodeAlpha DevOps &amp; Cloud Engineering Internship — Compound Project Repository
  </text>
</svg>
