<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1c1330"/>
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D24939"/>
      <stop offset="100%" stop-color="#8f2f24"/>
    </linearGradient>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A4EF"/>
      <stop offset="100%" stop-color="#036fa3"/>
    </linearGradient>
    <linearGradient id="linGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCC624"/>
      <stop offset="100%" stop-color="#b8930f"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .p1 { animation: pulse 2.2s ease-in-out infinite; }
      .p2 { animation: pulse 2.2s ease-in-out infinite 0.5s; }
      .p3 { animation: pulse 2.2s ease-in-out infinite 1s; }
      @keyframes pulse { 0%{opacity:.75} 50%{opacity:1} 100%{opacity:.75} }
      .flow { stroke-dasharray: 7 5; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      .flowRev { stroke-dasharray: 7 5; animation: dashRev 1s linear infinite; }
      @keyframes dashRev { to { stroke-dashoffset: 24; } }
      .lbl { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill:#e2e8f0; }
      .ttl { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill:#fff; font-weight:700; }
      .sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill:#cbd5e1; font-size:11.5px; }
      .tag { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill:#94a3b8; font-size:11px; }
      .lock { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
    </style>
  </defs>

  <rect width="900" height="380" rx="16" fill="url(#bg2)"/>
  <text x="450" y="32" text-anchor="middle" class="ttl" font-size="17">⚙️ Jenkins Remoting — Distributed &amp; Isolated Build Architecture</text>
  <text x="450" y="52" text-anchor="middle" class="tag">Controller orchestrates isolated remote agents across architectures</text>

  <!-- Controller (top center) -->
  <g class="p1" filter="url(#glow2)">
    <rect x="330" y="80" width="240" height="90" rx="14" fill="url(#ctrlGrad)" stroke="#fff" stroke-opacity="0.25"/>
  </g>
  <text x="450" y="112" text-anchor="middle" class="ttl" font-size="14">🎛️ Jenkins Controller</text>
  <text x="450" y="130" text-anchor="middle" class="sub">JCasC provisioning · 0 executors</text>
  <text x="450" y="146" text-anchor="middle" class="sub">Pipeline Dashboard · Stage/Graph View</text>

  <!-- Windows agent (bottom left) -->
  <g class="p2" filter="url(#glow2)">
    <rect x="60" y="250" width="230" height="100" rx="14" fill="url(#winGrad)" stroke="#fff" stroke-opacity="0.25"/>
  </g>
  <text x="175" y="282" text-anchor="middle" class="ttl" font-size="14">🪟 Windows Agent</text>
  <text x="175" y="300" text-anchor="middle" class="sub">JNLP remote node</text>
  <text x="175" y="316" text-anchor="middle" class="sub">Compiles binary payload</text>
  <text x="175" y="332" text-anchor="middle" class="sub" font-weight="600">🔒 isolated, least-privilege</text>

  <!-- Linux agent (bottom right) -->
  <g class="p3" filter="url(#glow2)">
    <rect x="610" y="250" width="230" height="100" rx="14" fill="url(#linGrad)" stroke="#fff" stroke-opacity="0.25"/>
  </g>
  <text x="725" y="282" text-anchor="middle" class="ttl" font-size="14">🐧 Linux Agent</text>
  <text x="725" y="300" text-anchor="middle" class="sub">SSH remote node (containerized)</text>
  <text x="725" y="316" text-anchor="middle" class="sub">Security patching + assembly</text>
  <text x="725" y="332" text-anchor="middle" class="sub" font-weight="600">🔒 isolated, least-privilege</text>

  <!-- Controller -> Windows (dispatch) -->
  <path d="M400 172 L200 250" stroke="#f8fafc" stroke-width="2.2" class="flow" fill="none"/>
  <circle r="4" fill="#ffffff"><animateMotion dur="1.4s" repeatCount="indefinite" path="M400 172 L200 250"/></circle>

  <!-- Windows -> Controller (stash) -->
  <path d="M240 250 L410 175" stroke="#93c5fd" stroke-width="2" class="flowRev" fill="none"/>
  <circle r="3.5" fill="#93c5fd"><animateMotion dur="1.6s" repeatCount="indefinite" path="M240 250 L410 175"/></circle>
  <text x="230" y="215" text-anchor="middle" class="tag" font-size="10">stash</text>

  <!-- Controller -> Linux (dispatch) -->
  <path d="M500 172 L700 250" stroke="#f8fafc" stroke-width="2.2" class="flow" fill="none"/>
  <circle r="4" fill="#ffffff"><animateMotion dur="1.4s" repeatCount="indefinite" path="M500 172 L700 250"/></circle>

  <!-- Controller -> Linux (unstash) -->
  <path d="M490 175 L660 250" stroke="#fde68a" stroke-width="2" class="flowRev" fill="none"/>
  <circle r="3.5" fill="#fde68a"><animateMotion dur="1.6s" repeatCount="indefinite" path="M490 175 L660 250"/></circle>
  <text x="670" y="215" text-anchor="middle" class="tag" font-size="10">unstash</text>

  <!-- Isolation boundary -->
  <rect x="45" y="240" width="810" height="120" rx="16" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="450" y="368" text-anchor="middle" class="tag lock">🔒 network-isolated agents — no inbound access to controller trust boundary</text>
</svg>
