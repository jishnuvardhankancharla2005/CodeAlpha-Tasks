<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background: #0d1117; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients & Glow Filters -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="controller-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="windows-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="linux-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="matrix-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Flow Particle Styles -->
    <style>
      @keyframes dash-flow {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse-node {
        0%, 100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.015); filter: brightness(1.25); }
      }
      @keyframes float-packet {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @keyframes status-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes rotate-gear {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .animated-line {
        stroke-dasharray: 10, 10;
        animation: dash-flow 2s linear infinite;
      }
      .node-card {
        transition: all 0.3s ease;
      }
      .status-dot {
        animation: status-blink 1.5s ease-in-out infinite;
      }
      .pulse-element {
        transform-origin: center;
        animation: pulse-node 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1100" height="700" fill="url(#bg-glow)" rx="16" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1100" height="700" fill="url(#grid)" />
  </g>

  <!-- HEADER TITLE & BADGES -->
  <g transform="translate(50, 45)">
    <!-- Title -->
    <text x="0" y="0" fill="#38bdf8" font-size="24" font-weight="800" letter-spacing="1">JENKINS REMOTING &amp; DISTRIBUTED PIPELINE ARCHITECTURE</text>
    <text x="0" y="24" fill="#94a3b8" font-size="13" font-weight="500">Cross-Platform Remoting • Stash/Unstash Mechanism • Groovy Dynamic Parallel Matrix</text>

    <!-- Badges Top Right -->
    <g transform="translate(700, -15)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="50" y="17" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">JCasC Enabled</text>

      <rect x="110" y="0" width="90" height="26" rx="13" fill="#1e293b" stroke="#4ade80" stroke-width="1" />
      <text x="155" y="17" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">Docker Core</text>

      <rect x="210" y="0" width="90" height="26" rx="13" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="255" y="17" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">JNLP + SSH</text>
    </g>
  </g>

  <!-- CONNECTOR LINES & ANIMATED DATA FLOW PATHS -->
  <!-- Line 1: Windows Agent to Controller (Stash) -->
  <path id="path-win-to-ctrl" d="M 280 230 L 410 230" fill="none" stroke="#3b82f6" stroke-width="3" />
  <path d="M 280 230 L 410 230" fill="none" stroke="#60a5fa" stroke-width="3" class="animated-line" />

  <!-- Line 2: Controller to Linux Agent (Unstash) -->
  <path id="path-ctrl-to-lin" d="M 690 230 L 820 230" fill="none" stroke="#10b981" stroke-width="3" />
  <path d="M 690 230 L 820 230" fill="none" stroke="#34d399" stroke-width="3" class="animated-line" />

  <!-- Line 3: Controller to Dynamic Matrix (Bottom) -->
  <path id="path-ctrl-to-matrix" d="M 550 360 L 550 440" fill="none" stroke="#8b5cf6" stroke-width="3" />
  <path d="M 550 360 L 550 440" fill="none" stroke="#a78bfa" stroke-width="3" class="animated-line" />

  <!-- Flowing Data Particles -->
  <circle r="6" fill="#60a5fa" filter="url(#glow-cyan)">
    <animateMotion dur="2.5s" repeatCount="indefinite">
      <mpath href="#path-win-to-ctrl" />
    </animateMotion>
  </circle>
  <circle r="6" fill="#34d399" filter="url(#glow-green)">
    <animateMotion dur="2.5s" repeatCount="indefinite">
      <mpath href="#path-ctrl-to-lin" />
    </animateMotion>
  </circle>
  <circle r="6" fill="#c084fc" filter="url(#glow-orange)">
    <animateMotion dur="2s" repeatCount="indefinite">
      <mpath href="#path-ctrl-to-matrix" />
    </animateMotion>
  </circle>

  <!-- NODE 1: WINDOWS AGENT -->
  <g transform="translate(50, 120)" class="node-card pulse-element">
    <rect width="230" height="240" rx="14" fill="url(#windows-grad)" stroke="#3b82f6" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- Header -->
    <rect width="230" height="42" rx="14" fill="#1d4ed8" opacity="0.4" />
    <circle cx="24" cy="21" r="7" fill="#3b82f6" class="status-dot" />
    <text x="40" y="26" fill="#ffffff" font-size="14" font-weight="700">WINDOWS AGENT</text>
    <text x="175" y="25" fill="#93c5fd" font-size="10" font-weight="600">JNLP Node</text>

    <!-- Body Info -->
    <g transform="translate(18, 60)" fill="#cbd5e1" font-size="12">
      <text x="0" y="15" fill="#93c5fd" font-weight="700">Host OS:</text>
      <text x="65" y="15">Windows Server / 11</text>
      
      <text x="0" y="38" fill="#93c5fd" font-weight="700">Launcher:</text>
      <text x="65" y="38">connect-windows-agent.ps1</text>

      <text x="0" y="61" fill="#93c5fd" font-weight="700">WorkDir:</text>
      <text x="65" y="61">C:\JenkinsAgent</text>

      <line x1="0" y1="75" x2="194" y2="75" stroke="#334155" stroke-width="1" />

      <!-- Step Action Box -->
      <rect x="0" y="90" width="194" height="65" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1" />
      <text x="10" y="110" fill="#60a5fa" font-size="11" font-weight="700">📦 Step: Compile Core</text>
      <text x="10" y="128" fill="#94a3b8" font-size="10">• Generates windows_core.dat</text>
      <text x="10" y="143" fill="#38bdf8" font-size="10" font-weight="600">⚡ Action: stash 'windows_payload'</text>
    </g>
  </g>

  <!-- NODE 2: JENKINS CONTROLLER -->
  <g transform="translate(410, 100)" class="node-card">
    <rect width="280" height="260" rx="14" fill="url(#controller-grad)" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-cyan)" />
    <!-- Header -->
    <rect width="280" height="46" rx="14" fill="#0284c7" opacity="0.3" />
    <circle cx="26" cy="23" r="8" fill="#38bdf8" class="status-dot" />
    <text x="44" y="28" fill="#ffffff" font-size="15" font-weight="800">JENKINS CONTROLLER</text>
    <text x="210" y="27" fill="#7dd3fc" font-size="10" font-weight="700">Docker :8080</text>

    <!-- Body Details -->
    <g transform="translate(20, 65)" fill="#e2e8f0" font-size="12">
      <text x="0" y="15" fill="#38bdf8" font-weight="700">Provisioning:</text>
      <text x="85" y="15">JCasC (casc.yaml)</text>

      <text x="0" y="38" fill="#38bdf8" font-weight="700">Plugins:</text>
      <text x="85" y="38">Pipeline Graph View, Job DSL</text>

      <text x="0" y="61" fill="#38bdf8" font-weight="700">Remoting Port:</text>
      <text x="85" y="61">50000 (JNLP Agent Port)</text>

      <line x1="0" y1="75" x2="240" y2="75" stroke="#334155" stroke-width="1" />

      <!-- Central Controller Stash Memory Box -->
      <rect x="0" y="90" width="240" height="85" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
      <text x="12" y="110" fill="#38bdf8" font-size="11" font-weight="700">💾 Controller In-Memory Stash</text>
      <text x="12" y="130" fill="#cbd5e1" font-size="10">Holds 'windows_payload' intermediate binary</text>
      <text x="12" y="146" fill="#4ade80" font-size="10">✔ Fingerprinting &amp; Artifact Storage</text>
      <text x="12" y="162" fill="#f59e0b" font-size="10">✔ Pipeline-Dashboard &amp; Stage View</text>
    </g>
  </g>

  <!-- NODE 3: LINUX AGENT -->
  <g transform="translate(820, 120)" class="node-card pulse-element">
    <rect width="230" height="240" rx="14" fill="url(#linux-grad)" stroke="#10b981" stroke-width="2" filter="url(#glow-green)" />
    <!-- Header -->
    <rect width="230" height="42" rx="14" fill="#059669" opacity="0.4" />
    <circle cx="24" cy="21" r="7" fill="#10b981" class="status-dot" />
    <text x="40" y="26" fill="#ffffff" font-size="14" font-weight="700">LINUX AGENT</text>
    <text x="170" y="25" fill="#a7f3d0" font-size="10" font-weight="600">SSH Node</text>

    <!-- Body Info -->
    <g transform="translate(18, 60)" fill="#cbd5e1" font-size="12">
      <text x="0" y="15" fill="#6ee7b7" font-weight="700">Image:</text>
      <text x="55" y="15">jenkins/ssh-agent:jdk17</text>

      <text x="0" y="38" fill="#6ee7b7" font-weight="700">Auth:</text>
      <text x="55" y="38">ED25519 SSH Keypair</text>

      <text x="0" y="61" fill="#6ee7b7" font-weight="700">Health:</text>
      <text x="55" y="61">nodeHealth.sh Verified</text>

      <line x1="0" y1="75" x2="194" y2="75" stroke="#1e293b" stroke-width="1" />

      <!-- Step Action Box -->
      <rect x="0" y="90" width="194" height="65" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="10" y="110" fill="#34d399" font-size="11" font-weight="700">⚡ Step: unstash &amp; Package</text>
      <text x="10" y="128" fill="#a7f3d0" font-size="10">• Attaches Linux Wrapper</text>
      <text x="10" y="143" fill="#6ee7b7" font-size="10" font-weight="600">🔒 Generates checksum.md5</text>
    </g>
  </g>

  <!-- NODE 4: DYNAMIC GROOVY PARALLEL TESTING MATRIX -->
  <g transform="translate(180, 440)">
    <rect width="740" height="210" rx="16" fill="url(#matrix-grad)" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-orange)" />
    <!-- Header -->
    <rect width="740" height="42" rx="16" fill="#6d28d9" opacity="0.4" />
    <circle cx="28" cy="21" r="7" fill="#a78bfa" class="status-dot" />
    <text x="45" y="26" fill="#ffffff" font-size="15" font-weight="800">DYNAMIC GROOVY PARALLEL TEST MATRIX &amp; SECURITY GATES</text>
    <text x="550" y="25" fill="#ddd6fe" font-size="11" font-weight="600">Programmatic Closure Matrix</text>

    <!-- 4 Parallel Test Cards -->
    <g transform="translate(20, 60)">
      <!-- Security Test Card -->
      <rect x="0" y="0" width="160" height="125" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="0" y="0" width="160" height="28" rx="10" fill="#0284c7" opacity="0.3" />
      <text x="80" y="19" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">🛡️ Security Audit</text>
      <text x="12" y="50" fill="#94a3b8" font-size="11">• SAST Scan</text>
      <text x="12" y="70" fill="#94a3b8" font-size="11">• Vulnerability Gate</text>
      <rect x="12" y="90" width="136" height="22" rx="4" fill="#0369a1" />
      <text x="80" y="105" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">PASSED (0 Vuln)</text>

      <!-- Integration Suite Card -->
      <rect x="180" y="0" width="160" height="125" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" />
      <rect x="180" y="0" width="160" height="28" rx="10" fill="#6d28d9" opacity="0.3" />
      <text x="260" y="19" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">🔗 Integration Suite</text>
      <text x="192" y="50" fill="#94a3b8" font-size="11">• Cross-Node API</text>
      <text x="192" y="70" fill="#94a3b8" font-size="11">• Contract Checks</text>
      <rect x="192" y="90" width="136" height="22" rx="4" fill="#5b21b6" />
      <text x="260" y="105" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">PASSED (100%)</text>

      <!-- Performance Test Card -->
      <rect x="360" y="0" width="160" height="125" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="360" y="0" width="160" height="28" rx="10" fill="#d97706" opacity="0.3" />
      <text x="440" y="19" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">⚡ Performance Load</text>
      <text x="372" y="50" fill="#94a3b8" font-size="11">• Latency Benchmark</text>
      <text x="372" y="70" fill="#94a3b8" font-size="11">• Remoting Throughput</text>
      <rect x="372" y="90" width="136" height="22" rx="4" fill="#b45309" />
      <text x="440" y="105" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">PASSED (&lt;50ms)</text>

      <!-- Regression Test Card -->
      <rect x="540" y="0" width="160" height="125" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <rect x="540" y="0" width="160" height="28" rx="10" fill="#059669" opacity="0.3" />
      <text x="620" y="19" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">🧪 Regression Suite</text>
      <text x="552" y="50" fill="#94a3b8" font-size="11">• Multi-Node Stash</text>
      <text x="552" y="70" fill="#94a3b8" font-size="11">• Integrity Check</text>
      <rect x="552" y="90" width="136" height="22" rx="4" fill="#047857" />
      <text x="620" y="105" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">PASSED (VERIFIED)</text>
    </g>
  </g>
</svg>
