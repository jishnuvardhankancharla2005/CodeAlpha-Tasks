credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "linux-agent-key"
              username: "jenkins"
              description: "SSH Key for Linux Agent"
              privateKeySource:
                directEntry:
                  privateKey: "${LINUX_AGENT_SSH_KEY}"

jenkins:
  systemMessage: "🚀 Welcome to Enterprise Jenkins Remoting & Advanced Pipeline Hub! Managed by JCasC."
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      permissions:
        - "Overall/Administer:${JENKINS_ADMIN_USER}"
        - "Overall/Read:authenticated"
  
  views:
    - listView:
        name: "Pipeline-Dashboard"
        description: "Overview of all Enterprise CI/CD and Remoting Pipelines"
        filterExecutors: false
        filterQueue: false
        statusFilter: true
        columns:
          - status
          - weather
          - jobName
          - lastSuccess
          - lastFailure
          - lastDuration
          - buildButton
        includeRegex: ".*"

  nodes:
    - permanent:
        labelString: "linux"
        mode: NORMAL
        name: "linux-agent"
        numExecutors: 2
        remoteFS: "/home/jenkins/agent"
        launcher:
          ssh:
            host: "linux-agent"
            port: 22
            credentialsId: "linux-agent-key"
            sshHostKeyVerificationStrategy:
              manuallyProvidedKeyVerificationStrategy:
                key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKJT5vZjuHuzvHjxvwwzP2zff7qzhvjHzLurnH37LvH3"
    - permanent:
        labelString: "windows"
        mode: NORMAL
        name: "windows-agent"
        numExecutors: 1
        remoteFS: "C:\\JenkinsAgent"
        launcher:
          jnlp:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: "remoting"
              workDirPath: "C:\\JenkinsAgent"

jobs:
  - script: >
      pipelineJob('Advanced-CI-CD-Pipeline') {
        displayName('⚡ Enterprise Advanced CI/CD Pipeline')
        description('Multi-agent cross-platform remoting pipeline with dynamic parallel matrix, security gate, and artifact fingerprinting.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('file:///var/jenkins_home/demo_repo')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
      pipelineJob('Distributed-Build-Demo') {
        displayName('🌐 Distributed Cross-Node Remoting Demo')
        description('Demonstrates stashing payloads between Windows and Linux agents via Jenkins Controller remoting.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('file:///var/jenkins_home/demo_repo')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkinsfile')
            lightweight(true)
          }
        }
      }
