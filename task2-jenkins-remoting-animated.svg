<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background: #0d1117; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="controller-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="windows-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="linux-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="matrix-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa" />
    </marker>

    <!-- CSS Animation Styles -->
    <style>
      @keyframes dash-flow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .animated-dash {
        stroke-dasharray: 8, 8;
        animation: dash-flow 1.5s linear infinite;
      }
      .status-pulse {
        animation: pulse-dot 1.8s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="750" fill="url(#bg-glow)" rx="16" />

  <!-- Grid Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="750" fill="url(#grid-pattern)" />
  </g>

  <!-- ==================== HEADER (CENTERED ALIGNMENT) ==================== -->
  <g transform="translate(600, 42)">
    <text x="0" y="0" fill="#38bdf8" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="1">JENKINS REMOTING &amp; DISTRIBUTED PIPELINE ARCHITECTURE</text>
    <text x="0" y="24" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">Cross-Platform Remoting • Stash/Unstash Payload Transfer • Groovy Parallel Test Matrix</text>

    <!-- Badges Row -->
    <g transform="translate(0, 40)">
      <!-- JCasC Badge -->
      <g transform="translate(-160, 0)">
        <rect x="-55" y="-12" width="110" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="0" y="4" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">JCasC Enabled</text>
      </g>
      <!-- Docker Core Badge -->
      <g transform="translate(0, 0)">
        <rect x="-55" y="-12" width="110" height="24" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="1" />
        <text x="0" y="4" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">Docker Core</text>
      </g>
      <!-- JNLP + SSH Badge -->
      <g transform="translate(160, 0)">
        <rect x="-55" y="-12" width="110" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
        <text x="0" y="4" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">JNLP + SSH</text>
      </g>
    </g>
  </g>

  <!-- ==================== CONNECTORS & ANIMATED FLOWS ==================== -->
  <!-- Connector 1: Windows Agent (Right Edge X=340, Y=265) -> Controller (Left Edge X=460, Y=265) -->
  <path id="flow-win-ctrl" d="M 340 265 L 460 265" fill="none" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-blue)" />
  <path d="M 340 265 L 450 265" fill="none" stroke="#60a5fa" stroke-width="3" class="animated-dash" />

  <!-- Flow Badge 1 -->
  <g transform="translate(400, 245)">
    <rect x="-42" y="-12" width="84" height="20" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="0" y="2" fill="#60a5fa" font-size="10" font-weight="700" text-anchor="middle">stash payload</text>
  </g>

  <!-- Connector 2: Controller (Right Edge X=740, Y=265) -> Linux Agent (Left Edge X=860, Y=265) -->
  <path id="flow-ctrl-lin" d="M 740 265 L 860 265" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)" />
  <path d="M 740 265 L 850 265" fill="none" stroke="#34d399" stroke-width="3" class="animated-dash" />

  <!-- Flow Badge 2 -->
  <g transform="translate(800, 245)">
    <rect x="-45" y="-12" width="90" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="0" y="2" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">unstash payload</text>
  </g>

  <!-- Connector 3: Controller (Bottom Edge X=600, Y=410) -> Matrix (Top Edge X=600, Y=480) -->
  <path id="flow-ctrl-matrix" d="M 600 410 L 600 480" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow-purple)" />
  <path d="M 600 410 L 600 470" fill="none" stroke="#c084fc" stroke-width="3" class="animated-dash" />

  <!-- Flow Badge 3 -->
  <g transform="translate(600, 445)">
    <rect x="-55" y="-10" width="110" height="20" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
    <text x="0" y="4" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">parallel test matrix</text>
  </g>

  <!-- Motion Particles -->
  <circle r="5" fill="#93c5fd" filter="url(#glow-cyan)">
    <animateMotion dur="2s" repeatCount="indefinite">
      <mpath href="#flow-win-ctrl" />
    </animateMotion>
  </circle>
  <circle r="5" fill="#a7f3d0" filter="url(#glow-green)">
    <animateMotion dur="2s" repeatCount="indefinite">
      <mpath href="#flow-ctrl-lin" />
    </animateMotion>
  </circle>
  <circle r="5" fill="#e9d5ff" filter="url(#glow-purple)">
    <animateMotion dur="1.8s" repeatCount="indefinite">
      <mpath href="#flow-ctrl-matrix" />
    </animateMotion>
  </circle>

  <!-- ==================== TOP ROW: 3 MAIN NODES (PERFECTLY ALIGNED) ==================== -->

  <!-- NODE 1: WINDOWS AGENT (X=60, Y=140, Width=280, Height=250) -->
  <g transform="translate(60, 140)">
    <rect width="280" height="250" rx="14" fill="url(#windows-grad)" stroke="#3b82f6" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- Node Header -->
    <rect width="280" height="44" rx="14" fill="#1d4ed8" opacity="0.35" />
    <circle cx="22" cy="22" r="6" fill="#3b82f6" class="status-pulse" />
    <text x="36" y="27" fill="#ffffff" font-size="14" font-weight="700">WINDOWS AGENT</text>
    <rect x="195" y="11" width="72" height="22" rx="11" fill="#1e293b" stroke="#60a5fa" stroke-width="1" />
    <text x="231" y="26" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle">JNLP Node</text>

    <!-- Node Details -->
    <g transform="translate(18, 58)" fill="#cbd5e1" font-size="12">
      <text x="0" y="15" fill="#93c5fd" font-weight="700">Launcher:</text>
      <text x="70" y="15">connect-windows-agent.ps1</text>

      <text x="0" y="36" fill="#93c5fd" font-weight="700">WorkDir:</text>
      <text x="70" y="36">C:\JenkinsAgent</text>

      <text x="0" y="57" fill="#93c5fd" font-weight="700">Protocol:</text>
      <text x="70" y="57">Inbound JNLP (TCP 50000)</text>

      <line x1="0" y1="70" x2="244" y2="70" stroke="#334155" stroke-width="1" />

      <!-- Step Action Box -->
      <rect x="0" y="82" width="244" height="92" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1" />
      <text x="12" y="104" fill="#60a5fa" font-size="11" font-weight="700">📦 Step: Compile Core Engine</text>
      <text x="12" y="123" fill="#94a3b8" font-size="10">• Generates binary windows_core.dat</text>
      <text x="12" y="140" fill="#94a3b8" font-size="10">• Validates execution environment</text>
      <text x="12" y="160" fill="#38bdf8" font-size="10" font-weight="700">⚡ Action: stash 'windows_payload'</text>
    </g>
  </g>

  <!-- NODE 2: JENKINS CONTROLLER (X=460, Y=120, Width=280, Height=290) [CENTERED] -->
  <g transform="translate(460, 120)">
    <rect width="280" height="290" rx="14" fill="url(#controller-grad)" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-cyan)" />
    <!-- Node Header -->
    <rect width="280" height="46" rx="14" fill="#0284c7" opacity="0.35" />
    <circle cx="24" cy="23" r="7" fill="#38bdf8" class="status-pulse" />
    <text x="40" y="28" fill="#ffffff" font-size="15" font-weight="800">JENKINS CONTROLLER</text>
    <rect x="195" y="12" width="74" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="232" y="27" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">Docker :8080</text>

    <!-- Node Details -->
    <g transform="translate(18, 62)" fill="#e2e8f0" font-size="12">
      <text x="0" y="15" fill="#38bdf8" font-weight="700">Provisioning:</text>
      <text x="85" y="15">JCasC (casc.yaml)</text>

      <text x="0" y="36" fill="#38bdf8" font-weight="700">Plugins:</text>
      <text x="85" y="36">Graph View, Stage View</text>

      <text x="0" y="57" fill="#38bdf8" font-weight="700">Security:</text>
      <text x="85" y="57">Matrix Auth &amp; Credentials</text>

      <line x1="0" y1="70" x2="244" y2="70" stroke="#334155" stroke-width="1" />

      <!-- Controller Stash Memory Box -->
      <rect x="0" y="82" width="244" height="128" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
      <text x="12" y="104" fill="#38bdf8" font-size="11" font-weight="700">💾 Controller In-Memory Stash</text>
      <text x="12" y="124" fill="#cbd5e1" font-size="10">• Buffers 'windows_payload' intermediate</text>
      <text x="12" y="142" fill="#4ade80" font-size="10">✔ Artifact Fingerprinting &amp; Checksums</text>
      <text x="12" y="160" fill="#f59e0b" font-size="10">✔ Pipeline Dashboard &amp; Weather View</text>
      <text x="12" y="178" fill="#a78bfa" font-size="10">✔ Dynamic Groovy Matrix Dispatcher</text>
      <text x="12" y="196" fill="#38bdf8" font-size="10" font-weight="700">⚡ Status: Orchestrating Agents</text>
    </g>
  </g>

  <!-- NODE 3: LINUX AGENT (X=860, Y=140, Width=280, Height=250) -->
  <g transform="translate(860, 140)">
    <rect width="280" height="250" rx="14" fill="url(#linux-grad)" stroke="#10b981" stroke-width="2" filter="url(#glow-green)" />
    <!-- Node Header -->
    <rect width="280" height="44" rx="14" fill="#059669" opacity="0.35" />
    <circle cx="22" cy="22" r="6" fill="#10b981" class="status-pulse" />
    <text x="36" y="27" fill="#ffffff" font-size="14" font-weight="700">LINUX AGENT</text>
    <rect x="195" y="11" width="72" height="22" rx="11" fill="#064e3b" stroke="#34d399" stroke-width="1" />
    <text x="231" y="26" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">SSH Node</text>

    <!-- Node Details -->
    <g transform="translate(18, 58)" fill="#cbd5e1" font-size="12">
      <text x="0" y="15" fill="#6ee7b7" font-weight="700">Container:</text>
      <text x="70" y="15">jenkins/ssh-agent:jdk17</text>

      <text x="0" y="36" fill="#6ee7b7" font-weight="700">Auth Key:</text>
      <text x="70" y="36">ED25519 SSH Keypair</text>

      <text x="0" y="57" fill="#6ee7b7" font-weight="700">Health Audit:</text>
      <text x="70" y="57">nodeHealth.sh Verified</text>

      <line x1="0" y1="70" x2="244" y2="70" stroke="#1e293b" stroke-width="1" />

      <!-- Step Action Box -->
      <rect x="0" y="82" width="244" height="92" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="12" y="104" fill="#34d399" font-size="11" font-weight="700">⚡ Step: Unstash &amp; Assemble</text>
      <text x="12" y="123" fill="#a7f3d0" font-size="10">• Receives payload from Controller</text>
      <text x="12" y="140" fill="#a7f3d0" font-size="10">• Attaches wrapper &amp; generates MD5</text>
      <text x="12" y="160" fill="#6ee7b7" font-size="10" font-weight="700">🔒 Action: archiveArtifacts &amp; fingerprint</text>
    </g>
  </g>

  <!-- ==================== BOTTOM ROW: DYNAMIC GROOVY PARALLEL MATRIX (X=60, Y=480, Width=1080, Height=220) ==================== -->
  <g transform="translate(60, 480)">
    <rect width="1080" height="220" rx="16" fill="url(#matrix-grad)" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-purple)" />
    <!-- Header -->
    <rect width="1080" height="42" rx="16" fill="#6d28d9" opacity="0.35" />
    <circle cx="28" cy="21" r="7" fill="#a78bfa" class="status-pulse" />
    <text x="46" y="26" fill="#ffffff" font-size="15" font-weight="800">DYNAMIC GROOVY PARALLEL TEST MATRIX &amp; SECURITY GATES</text>
    <rect x="910" y="10" width="150" height="22" rx="11" fill="#2e1065" stroke="#c084fc" stroke-width="1" />
    <text x="985" y="25" fill="#e9d5ff" font-size="10" font-weight="700" text-anchor="middle">Programmatic Closures</text>

    <!-- 4 EVENLY SPACED PARALLEL TEST SUITE CARDS (Width: 225 each, Gap: 30) -->
    <g transform="translate(30, 60)">
      
      <!-- CARD 1: SECURITY AUDIT (X=0) -->
      <g transform="translate(0, 0)">
        <rect width="225" height="135" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <rect width="225" height="30" rx="10" fill="#0284c7" opacity="0.3" />
        <text x="112" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">🛡️ Security Audit Suite</text>
        <text x="14" y="52" fill="#94a3b8" font-size="11">• SAST Code Vulnerability Gate</text>
        <text x="14" y="72" fill="#94a3b8" font-size="11">• Dependency Analysis Audit</text>
        <rect x="14" y="94" width="197" height="26" rx="6" fill="#0369a1" />
        <text x="112" y="111" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PASSED (0 Vulnerabilities)</text>
      </g>

      <!-- CARD 2: INTEGRATION SUITE (X=255) -->
      <g transform="translate(255, 0)">
        <rect width="225" height="135" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" />
        <rect width="225" height="30" rx="10" fill="#6d28d9" opacity="0.3" />
        <text x="112" y="20" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">🔗 Integration Suite</text>
        <text x="14" y="52" fill="#94a3b8" font-size="11">• Cross-Node API Verification</text>
        <text x="14" y="72" fill="#94a3b8" font-size="11">• Remoting Protocol Contracts</text>
        <rect x="14" y="94" width="197" height="26" rx="6" fill="#5b21b6" />
        <text x="112" y="111" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PASSED (100% Coverage)</text>
      </g>

      <!-- CARD 3: PERFORMANCE LOAD (X=510) -->
      <g transform="translate(510, 0)">
        <rect width="225" height="135" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
        <rect width="225" height="30" rx="10" fill="#d97706" opacity="0.3" />
        <text x="112" y="20" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">⚡ Performance Load Test</text>
        <text x="14" y="52" fill="#94a3b8" font-size="11">• Remoting Latency Benchmark</text>
        <text x="14" y="72" fill="#94a3b8" font-size="11">• Stash/Unstash Bandwidth</text>
        <rect x="14" y="94" width="197" height="26" rx="6" fill="#b45309" />
        <text x="112" y="111" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PASSED (&lt;50ms Latency)</text>
      </g>

      <!-- CARD 4: REGRESSION SUITE (X=765) -->
      <g transform="translate(765, 0)">
        <rect width="225" height="135" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
        <rect width="225" height="30" rx="10" fill="#059669" opacity="0.3" />
        <text x="112" y="20" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">🧪 Regression Suite</text>
        <text x="14" y="52" fill="#94a3b8" font-size="11">• Multi-Node File Integrity</text>
        <text x="14" y="72" fill="#94a3b8" font-size="11">• MD5 Checksum Verification</text>
        <rect x="14" y="94" width="197" height="26" rx="6" fill="#047857" />
        <text x="112" y="111" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PASSED (Zero Defects)</text>
      </g>

    </g>
  </g>
</svg>
